# release-plz release-pr を使って workspace の version と changelog を更新する

name: release-pr

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  release-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - name: Install alsa deps
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev portaudio19-dev build-essential libpulse-dev libdbus-1-dev

      - name: Create or update release PR
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
